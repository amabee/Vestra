<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'"
    />
    <title>Vestra Nova</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0d0d10;
        color: #f4f4f5;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Frameless window: the whole placeholder is draggable. */
        -webkit-app-region: drag;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 0.875rem;
        background: linear-gradient(135deg, #7c3aed, #22d3ee);
        font-weight: 700;
        font-size: 1.25rem;
        color: #fff;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        font-size: 0.8125rem;
      }
      code {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.75rem;
        color: #d4d4d8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">V</div>
      <h1>Vestra Nova</h1>
      <p>
        No interface is bundled yet. The main process, the IPC bridge and the
        extension runtime are all running &mdash; this window is waiting on a
        renderer.
      </p>
      <p style="margin-top: 1rem">
        <code>apps/nova/electron/shell.html</code>
      </p>
    </main>
  </body>
</html>
