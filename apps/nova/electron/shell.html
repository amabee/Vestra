<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Vestra Nova</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0d0d10;
        color: #f4f4f5;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-app-region: drag;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        width: min(34rem, 92vw);
        padding: 2rem;
      }
      header {
        text-align: center;
        margin-bottom: 1.75rem;
      }
      .mark {
        width: 2.75rem;
        height: 2.75rem;
        margin: 0 auto 1rem;
        display: grid;
        place-items: center;
        border-radius: 0.8rem;
        background: linear-gradient(135deg, #7c3aed, #22d3ee);
        font-weight: 700;
        color: #fff;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
        font-weight: 600;
      }
      .sub {
        margin: 0;
        color: #71717a;
        font-size: 0.75rem;
      }
      .ok,
      .error {
        margin: 0 0 1.25rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.75rem;
        text-align: center;
      }
      .ok {
        background: rgba(16, 185, 129, 0.12);
        color: #34d399;
      }
      .error {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
      }
      .grid {
        display: grid;
        gap: 0.125rem;
        margin-bottom: 1.5rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.4rem 0.75rem;
        border-radius: 0.375rem;
        background: rgba(255, 255, 255, 0.02);
      }
      .label {
        color: #71717a;
      }
      .value {
        color: #d4d4d8;
      }
      .heading {
        margin: 0 0 0.5rem;
        color: #71717a;
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .provider {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
      }
      .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        flex: none;
      }
      .on .dot {
        background: #34d399;
      }
      .off .dot {
        background: #52525b;
      }
      .name {
        flex: 1;
      }
      .off .name {
        color: #a1a1aa;
      }
      .state {
        color: #52525b;
        font-size: 0.6875rem;
      }
      .path {
        margin: 1.5rem 0 0;
        color: #3f3f46;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.6875rem;
        text-align: center;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">V</div>
        <h1>Vestra Nova</h1>
        <p class="sub">No interface yet — this page verifies the IPC layer.</p>
      </header>
      <div id="report"></div>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
