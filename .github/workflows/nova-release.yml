name: Build Nova release
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: pnpm install --frozen-lockfile
      - name: Validate stable release version
        shell: pwsh
        run: |
          $version = (Get-Content apps/nova/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable semantic versions can use this release pipeline.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the Nova app version.' }
      - run: pnpm extensions:verify
      - run: pnpm test:foundry
      - run: pnpm --filter @vestra/nova typecheck
      - run: pnpm test:updater
      - run: pnpm test:settings
      - run: pnpm test:settings:expansion
      - run: pnpm test:settings:integrations
      - run: pnpm test:anilist:login
      - run: pnpm test:anilist:sync
      - run: pnpm test:updater:ui
      - run: pnpm test:extensions:install
      - run: pnpm test:extensions:updates
      - run: pnpm test:sources:remote
      - run: pnpm test:anilist:visibility
      - run: pnpm test:ipc:queries
      - run: pnpm test:manga:pagination
      - run: pnpm test:reliability
      - run: pnpm test:manga:navigation
      - run: pnpm test:manga:preload
      - run: node apps/nova/scripts/test-manga-information.mjs
      - run: pnpm test:anime:runtime
      - run: pnpm audit --audit-level=low
      - run: pnpm --filter @vestra/nova build:electron
      - run: pnpm test:security
      - name: Select Windows signing mode
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ vars.VESTRA_WINDOWS_PUBLISHER }}
        run: |
          if (-not $env:CSC_LINK -and -not $env:CSC_KEY_PASSWORD -and -not $env:WINDOWS_PUBLISHER) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Output 'Signing is deferred; building an unsigned release with all other security checks enabled.'
          } elseif ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD -and $env:WINDOWS_PUBLISHER) {
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            throw 'Signing configuration is incomplete. Configure all three signing values or remove them to defer signing.'
          }
      - name: Build Windows x64 NSIS installer
        run: pnpm --filter @vestra/nova release:build --config.forceCodeSigning=${{ steps.signing.outputs.enabled }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: pnpm test:settings:ui
      - run: pnpm test:settings:integrations:ui
      - run: node apps/nova/scripts/test-anilist-sync-ui.mjs
      - run: pnpm test:reliability:ui
      - run: node apps/nova/scripts/test-reader-ui.mjs
      - name: Smoke-test packaged worker and compiler
        run: node apps/nova/scripts/test-packaged-worker.mjs --resources apps/nova/release/win-unpacked/resources
      - run: node apps/nova/scripts/test-packaged-security.mjs
      - run: pnpm test:updater:ipc
      - name: Validate installer, hashes, blockmap and embedded feed
        shell: pwsh
        env:
          VESTRA_WINDOWS_PUBLISHER: ${{ vars.VESTRA_WINDOWS_PUBLISHER }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue }
          pnpm release:validate
      - name: Verify Windows publisher signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_PUBLISHER: ${{ vars.VESTRA_WINDOWS_PUBLISHER }}
        run: |
          $version = (Get-Content apps/nova/package.json -Raw | ConvertFrom-Json).version
          ./apps/nova/scripts/verify-windows-signature.ps1 -InstallerPath "apps/nova/release/Vestra-Nova-$version-Setup-x64.exe" -AppPath 'apps/nova/release/win-unpacked/Vestra Nova.exe' -ExpectedPublisherName $env:WINDOWS_PUBLISHER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nova-windows-installer
          path: |
            apps/nova/release/Vestra-Nova-*-Setup-x64.exe
            apps/nova/release/*.exe.blockmap
            apps/nova/release/latest.yml
          if-no-files-found: error
      - name: Create or update draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($release | ConvertFrom-Json).isDraft) { throw 'Published releases are immutable; bump the version instead.' }
          } else {
            gh release create $tag --verify-tag --draft --title "Vestra Nova $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = @(Get-ChildItem apps/nova/release -File | Where-Object { $_.Name -like 'Vestra-Nova-*-Setup-x64.exe' -or $_.Name -like '*.exe.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
