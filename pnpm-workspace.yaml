packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Dependencies allowed to run install scripts. sharp powers Next.js image
# optimisation; the electron packages unpack their prebuilt binaries.
onlyBuiltDependencies:
  - sharp
  - electron
  - electron-winstaller
  - esbuild

allowBuilds:
  electron-winstaller: true
  esbuild: true
  sharp: true

# Single source of truth for dependency versions across every workspace package.
# Reference with the `catalog:` protocol, e.g. `"next": "catalog:"`.
#
# NOTE ON TYPESCRIPT: pinned to 6.x, not 7.x. TypeScript 7 is the native (Go)
# rewrite, but typescript-eslint@8 declares `typescript: >=4.8.4 <6.1.0`.
# Moving to TS 7 breaks linting until typescript-eslint ships TS 7 support.
catalog:
  # --- Framework ---
  next: ^16.2.12
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

  # --- Language / tooling ---
  typescript: ^6.0.3
  "@types/node": ^26.1.2
  eslint: ^10.8.0
  "typescript-eslint": ^8.65.0
  "@eslint/js": ^10.0.1
  "eslint-config-prettier": ^10.1.8
  "eslint-plugin-react-hooks": ^7.1.1
  prettier: ^3.9.6

  # --- Styling ---
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "tailwind-merge": ^3.6.0
  clsx: ^2.1.1
  "class-variance-authority": ^0.7.1
  "tw-animate-css": ^1.4.0
  "lucide-react": ^1.28.0

  # --- State / data ---
  zustand: ^5.0.14
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-query-devtools": ^5.101.4
  zod: ^4.4.3
  motion: ^12.43.0

  # --- Radix primitives (shadcn/ui) ---
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-scroll-area": ^1.2.18
  "@radix-ui/react-separator": ^1.1.15
  "@radix-ui/react-slot": ^1.3.3
  "@radix-ui/react-tabs": ^1.1.21
  "@radix-ui/react-tooltip": ^1.2.16
